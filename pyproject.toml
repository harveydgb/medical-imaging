[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical_imaging_coursework"
version = "1.0.0"
description = "Medical Imaging Coursework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "matplotlib",
    "pydicom",     # For handling DICOM files
    "torch",       # For the UNet segmentation
    "torchvision"
]

[project.optional-dependencies]
dev = [
    "pytest",      # For your unit tests
    "sphinx",      # For your auto-documentation
]

[tool.pytest.ini_options]
testpaths = ["tests"]